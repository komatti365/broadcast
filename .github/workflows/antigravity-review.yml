name: Scheduled Bug Check via Antigravity

on:
  schedule:
    # 毎日 日本時間 午前2:00（UTC 17:00）に自動実行
    - cron: '0 17 * * *'
  workflow_dispatch: # 必要に応じて手動でも実行可能に

jobs:
  antigravity-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # すべてのGit履歴を取得（エージェントの推論に役立ちます）

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          # Pythonの依存関係をインストール
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Antigravity CLI
        run: |
          # Antigravity CLIのインストール
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          # パスを通す
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Antigravity Autonomous Review
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # エージェントへのミッション（指示）を出して実行
          antigravity run \
            --headless \
            --execute \
            --mission "リポジトリ内のPythonコードを走査してバグや潜在的な脆弱性をチェックしてください。問題が見つかった場合はコードを修正し、Pythonスクリプトとして正常に動作すること、およびシンタックスエラーがないことを確認してください。問題がなければ、修正内容をまとめたドキュメント（Walkthrough）を作成し、'ai-bugfix-antigravity' という新しいGitブランチを作成して変更をコミット・プッシュしてください。"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "ai-bugfix-antigravity"
          title: "🤖【Antigravity】定期自動バグ修正・検証済みPR"
          body: |
            Antigravity AIエージェントによる定期自動コードレビューの結果です。
            
            **エージェントの実行内容:**
            - コードベースのバグ・脆弱性スキャン
            - 修正コードの自動適用
            - ローカル環境での検証（パス済み）
            
            修正内容を確認の上、マージしてください。