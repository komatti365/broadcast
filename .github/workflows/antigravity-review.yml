name: Scheduled Bug Check via Antigravity

on:
  schedule:
    # 毎日 日本時間 午前2:00（UTC 17:00）に自動実行
    - cron: '0 17 * * *'
  workflow_dispatch: # 必要に応じて手動でも実行可能に

jobs:
  antigravity-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # すべてのGit履歴を取得（エージェントの推論に役立ちます）

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          # Pythonの依存関係をインストール
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Antigravity Autonomous Review using Python SDK
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGY_DEBUG: 1
        run: |
          # SDKのインストール
          pip install google-antigravity
          
          # Python SDKを使用してエージェントを実行
          python -c "
          import asyncio
          import os
          import sys
          from google.antigravity import Agent, LocalAgentConfig
          
          async def main():
              # ANTIGRAVITY_API_KEYをGEMINI_API_KEYに割り当てる
              if 'ANTIGRAVITY_API_KEY' in os.environ and 'GEMINI_API_KEY' not in os.environ:
                  os.environ['GEMINI_API_KEY'] = os.environ['ANTIGRAVITY_API_KEY']
                  
              mission = (
                  'リポジトリ内のPythonコードを走査してバグや潜在的な脆弱性をチェックしてください。'
                  '問題が見つかった場合はコードを修正し、Pythonスクリプトとして正常に動作すること、およびシンタックスエラーがないことを確認してください。'
                  '修正と検証が成功した場合は、その修正内容をまとめた詳細なレポートを \"walkthrough.md\" というファイル名でルート直下に作成し、'
                  '\"ai-bugfix-antigravity\" という新しいGitブランチを作成して変更をコミット・プッシュしてください。'
                  '問題が見つからなかった場合は、ファイル作成やブランチ作成などの操作は一切行わずにそのまま終了してください。'
              )
              
              if not os.environ.get('GEMINI_API_KEY'):
                  print('Error: GEMINI_API_KEY/ANTIGRAVITY_API_KEY is not set', file=sys.stderr)
                  sys.exit(1)
                  
              print('Starting Antigravity Agent using Python SDK...')
              config = LocalAgentConfig()
              async with Agent(config) as agent:
                  print('Sending mission to the agent...')
                  response = await agent.chat(mission)
                  print('Agent Execution Finished.')
                  print(await response.text())
          
          if __name__ == '__main__':
              asyncio.run(main())
          "

      - name: Read Walkthrough Report
        id: read_report
        run: |
          # walkthrough.md が存在する場合、その内容をPRのBody用の環境変数に格納
          if [ -f walkthrough.md ]; then
            echo "WALKTHROUGH_BODY<<EOF" >> $GITHUB_ENV
            cat walkthrough.md >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "WALKTHROUGH_BODY=⚠️ 自動レビューは完了しましたが、詳細な walkthrough.md レポートは生成されませんでした。" >> $GITHUB_ENV
          fi

      - name: Create Pull Request
        if: steps.check_report.outputs.exists == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "ai-bugfix-antigravity"
          title: "🤖【Antigravity】定期自動バグ修正・検証済みPR"
          body: |
            Antigravity AIエージェントによる定期自動コードレビューの結果です。
            
            ## 📝 詳細なレビュー・修正結果
            
            ${{ env.WALKTHROUGH_BODY }}