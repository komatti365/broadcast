name: Scheduled Bug Check via Antigravity

on:
  schedule:
    # 毎日 日本時間 午前2:00（UTC 17:00）に自動実行
    - cron: '0 17 * * *'
  workflow_dispatch: # 必要に応じて手動でも実行可能に

jobs:
  antigravity-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # すべてのGit履歴を取得（エージェントの推論に役立ちます）

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          # Pythonの依存関係をインストール
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Antigravity CLI
        run: |
          # Antigravity CLIのインストール
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          # パスを通す
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Antigravity Autonomous Review
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGY_DEBUG: 1
        run: |
          # エージェントへのミッション（指示）を出して実行
          agy run \
            --headless \
            --execute \
            --mission "リポジトリ内のPythonコードを走査してバグや潜在的な脆弱性をチェックしてください。問題が見つかった場合はコードを修正し、Pythonスクリプトとして正常に動作すること、およびシンタックスエラーがないことを確認してください。修正と検証が成功した場合は、その修正内容をまとめた詳細なレポートを 'walkthrough.md' というファイル名でルート直下に作成し、'ai-bugfix-antigravity' という新しいGitブランチを作成して変更をコミット・プッシュしてください。問題が見つからなかった場合は、ファイル作成やブランチ作成などの操作は一切行わずにそのまま終了してください。"

      - name: Check if Report Exists & Read Content
        id: check_report
        run: |
          # walkthrough.md が存在するかチェック
          if [ -f walkthrough.md ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            # PR本文用にレポート内容を環境変数に格納
            echo "WALKTHROUGH_BODY<<EOF" >> $GITHUB_ENV
            cat walkthrough.md >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_report.outputs.exists == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "ai-bugfix-antigravity"
          title: "🤖【Antigravity】定期自動バグ修正・検証済みPR"
          body: |
            Antigravity AIエージェントによる定期自動コードレビューの結果です。
            
            ## 📝 詳細なレビュー・修正結果
            
            ${{ env.WALKTHROUGH_BODY }}