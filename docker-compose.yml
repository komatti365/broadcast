version: "3.9"

services:
  broadcast:
    build:
      context: .
      dockerfile: Dockerfile
    image: nucosen-broadcast:latest
    container_name: broadcast
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NICO_COOKIE_FILE=/data/nico_cookie.json
      # Vault Agent Shared Secrets
      - DB_KEY_FILE=/secrets/db_key.txt
      - NICO_ID_FILE=/secrets/nico_id.txt
      - NICO_PW_FILE=/secrets/nico_pw.txt
      - NICO_TFA_FILE=/secrets/nico_tfa.txt
      - NICO_TOKEN_FILE=/secrets/nico_token.txt
    volumes:
      - broadcast_data:/data
      - shared_secrets:/secrets:ro
    depends_on:
      - vault-agent
    command: ["nucosen"]

  vault-agent:
    image: hashicorp/vault:latest
    container_name: broadcast_vault_agent
    restart: unless-stopped
    command: agent -config=/vault/config/vault-agent.hcl
    volumes:
      - ./vault:/vault/config:ro
      - shared_secrets:/secrets
    environment:
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}

volumes:
  shared_secrets:
    driver: local
  broadcast_data:
    driver: local
